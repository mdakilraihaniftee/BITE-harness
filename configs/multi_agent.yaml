multi_agent:
  num_agents: 2
  max_agents: 4

  execution:
    mode: concurrent
    max_concurrent_workers: 2
    task_timeout_seconds: 600
    peer_review_rounds: 1

  coordinator:
    agent_config: examples/local_grounding_tools.yaml
    tool_access: false
    max_rounds: 2
    # Plan + synthesis, plus room for bounded estimate reassessments. A
    # coordinator call can use 2 requests (answer-tag retry), and every
    # reassessment counts against this and the global model budget.
    model_requests: 8
    estimate_updates:
      enabled: false          # the Studio runners pass --estimate-updates
      trigger: meaningful_evidence
      max_reassessments: 2
    max_follow_up_rounds: 0

  workers:
    default:
      agent_config: examples/local_grounding_tools.yaml
      role: general visual investigator
      tool_calls: 12
      model_requests: 20
    overrides:
      worker_02:
        role: independent verification and contradiction checking

  memory:
    optional_worker_memory: true   # private cross-phase notebook; working context is always on

  communication:
    enabled: true
    peer_to_peer: true
    max_messages_per_actor: 20
    max_inbox_per_actor: 40

  budget:
    global_tool_calls: 40
    global_model_requests: 80
    global_messages: 100

  output:
    directory: outputs/multi_agent

