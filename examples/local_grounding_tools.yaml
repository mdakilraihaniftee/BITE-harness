# Fully local example: Qwen plus grounding, OCR, depth/camera pose, Zoom, and Python.
# It intentionally excludes web/search tools, so no provider API key is required.
agent_name: MainAgent
agent_config_version: local_grounding_tools_v1
agent:
  model_service: orchestrator
  max_iterations: 15
  max_context_length: 168000
  tool_choice: auto
  paired_sampling_seed: false
memory:
  emit_policy: always
  modules:
  - name: image
  - name: tool_context
  - name: url
    webpage_env_update_limit: 20
capabilities:
  registries:
  - paper
  tools:
    grounding:
      backend: sam3_segment
    ocr:
      backend: ocr
    depth:
      backend: depth_estimation
    camera_pose:
      backend: camera_trajectory
    zoom:
      backend: zoom_in_image_by_bbox
    coding:
      generator: python_coding_agent
      executor: python_executor_local
services:
  client:
    base_url: ${TOOL_SERVER_URL}
    timeout_seconds: 600
    retry: 8
  server:
    host: 127.0.0.1
    port: 8101
    registration: configured_only
  tools:
    sam3_segment:
      server_url: ${SAM3_SERVER_URL}
    ocr:
      server_url: ${OCR_SERVER_URL}
    depth_estimation: &depth_service
      server_url: ${DEPTH_ESTIMATION_SERVER_URL}
    camera_trajectory: *depth_service
    zoom_in_image_by_bbox: {}
    python_coding_agent:
      model_service: orchestrator
      context: fresh
    python_executor_local:
      transport: local
      timeout_seconds: 30
  models:
    orchestrator:
      alias: qwen3-vl-8b-instruct
      base: ${MODEL_BASE_URL}
      key: ${MODEL_API_KEY}
      max_tokens: 12800
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      repetition_penalty: 1.0
      presence_penalty: 1.5
      return_token_ids: false
      timeout: 600
      retry: 8
